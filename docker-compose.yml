services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reservation_app
    volumes:
      - .:/var/www/html
    networks:
      - reservation_net

  db:
    image: mysql:8.0
    container_name: reservation_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - reservation_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: reservation_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    networks:
      - reservation_net

networks:
  reservation_net:
    driver: bridge

volumes:
  db_data: